<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos Cromo / Demo</title>
<meta name="theme-color" content="#0B6E78">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedidos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --ink:#16232E; --muted:#5B6B78; --line:#D6DEE4;
  --cromo:#0B6E78; --cromo-bg:#DDF0F1; --demo:#7A4EB0; --demo-bg:#EBE1F6;
  --warn:#9A5B00; --warn-bg:#FBEBCB; --danger:#B3261E; --btn:#16232E; --btn-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A22; --surface:#16242F; --ink:#E6EEF3; --muted:#9AAAB6; --line:#2A3C49;
    --cromo:#4FC3CE; --cromo-bg:#14363B; --demo:#B995E8; --demo-bg:#2C2142;
    --warn:#F2B35A; --warn-bg:#3B2B10; --danger:#FF8A80; --btn:#E6EEF3; --btn-ink:#0F1A22;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A22; --surface:#16242F; --ink:#E6EEF3; --muted:#9AAAB6; --line:#2A3C49;
  --cromo:#4FC3CE; --cromo-bg:#14363B; --demo:#B995E8; --demo-bg:#2C2142;
  --warn:#F2B35A; --warn-bg:#3B2B10; --danger:#FF8A80; --btn:#E6EEF3; --btn-ink:#0F1A22;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand small{font-weight:500;color:var(--muted);margin-left:6px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
nav button[aria-current="true"]{background:var(--ink);color:var(--bg)}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cromo);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:20px;margin:0 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea{min-height:90px;resize:vertical}
.btn{background:var(--btn);color:var(--btn-ink);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.sm{padding:4px 9px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 18px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"].c{background:var(--cromo);color:#fff}
.seg button[aria-pressed="true"].d{background:var(--demo);color:#fff}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600}
.tag.c{background:var(--cromo-bg);color:var(--cromo)}
.tag.d{background:var(--demo-bg);color:var(--demo)}
.tag.w{background:var(--warn-bg);color:var(--warn)}
.results{border:1px solid var(--line);border-radius:8px;margin-top:6px;max-height:260px;overflow:auto;background:var(--surface)}
.results:empty{display:none}
.results button{display:flex;width:100%;text-align:left;gap:10px;padding:8px 10px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;align-items:center}
.results button:last-child{border-bottom:0}
.results button:hover,.results button:focus-visible{background:var(--bg)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:13px;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input,td select{padding:5px 7px}
td.r,th.r{text-align:right}
tr.ovr td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.chip{display:inline-flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.totals{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;margin-top:14px}
.totals .box{min-width:140px}
.totals .big{font-size:22px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:20;font-weight:500}
.notice{background:var(--warn-bg);color:var(--warn);padding:9px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
/* documentos */
.sheet{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:26px;max-width:820px;margin:0 auto;font-size:14px}
.sheet h1{font-size:20px;margin:0 0 2px}
.sheet .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#444;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid #111}
.sheet h4{margin:16px 0 4px;font-size:14px;padding:3px 8px;background:#eee}
.sheet table th{color:#444;border-bottom:1px solid #999}
.sheet td{border-bottom:1px solid #ddd}
.sheet .sum td{border-bottom:0;font-weight:700}
.sheet .mk{font-size:11px;border:1px solid #111;border-radius:3px;padding:0 4px;margin-left:6px}
@media (max-width:640px){.sheet{padding:14px}}
@media print{
  .noprint{display:none!important}
  html,body{background:#fff}
  :root{padding:0}
  main{padding:0;max-width:none}
  .sheet{border:0;border-radius:0;padding:0;max-width:none}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:in .18s ease-out}}
@keyframes in{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<header class="top noprint"><div class="top-in">
  <div class="brand">Pedidos<small>Cromo / Demo</small></div>
  <nav id="nav" aria-label="Secciones"></nav>
  <span class="spacer"></span>
  <span id="netTag" class="tag w" hidden>Sin conexión</span>
  <button id="installBtn" class="btn sm" data-a="install" hidden>Instalar app</button>
</div>
<div id="updBar" class="notice" hidden style="margin:0;border-radius:0;text-align:center">Hay una versión nueva de la app. <button class="btn sm" data-a="applyUpdate">Actualizar ahora</button></div>
</header>
<main id="main"></main>
<div id="toast" class="toast" hidden role="status"></div>

<script>
/* ---------- Constantes de negocio ---------- */
const CATS = {
  bulto:{l:'Bulto cerrado',d:'Rosario'},
  papel:{l:'Papel higiénico',d:'Rosario'},
  accesorio:{l:'Accesorio',d:'Rosario'},
  materia:{l:'Materia prima',d:'Rosario'},
  liq_chico:{l:'Líquido chico (<5 L)',d:'Rosario'},
  contenedor:{l:'Contenedor',d:'Gálvez'},
  tambor:{l:'Tambor',d:'Gálvez'},
  bidon20:{l:'Bidón 20 L',d:'Gálvez'},
  bidon5:{l:'Bidón 5 L',d:'Gálvez'},
  envase:{l:'Envase / recarga',d:'Rosario'}
};
const DEPOTS = ['Rosario','Gálvez'];
const DOC_ORDER = {
  'Rosario':['bulto','papel','accesorio','materia','liq_chico'],
  'Gálvez':['contenedor','tambor','bidon20','bidon5']
};
const MODS = {cromo:'Cromo', demo:'Demo'};
const KEY = 'pedidos_cromo_demo_v1';

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const fmt = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(n||0);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const today = () => new Date().toISOString().slice(0,10);
const fdate = d => d ? d.split('-').reverse().join('/') : '';
function num(s){ s=String(s??'').trim().replace(/[$\s]/g,''); if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?0:n; }
function match(q, text){ const t=norm(text); return norm(q).split(/\s+/).filter(Boolean).every(w=>t.includes(w)); }
function catOrder(depot){ const base=DOC_ORDER[depot]||[]; return base.concat(Object.keys(CATS).filter(k=>!base.includes(k))); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2600); }

/* ---------- Estado y persistencia ---------- */
function newOrder(){ return {id:uid(),num:null,clientId:null,mod:'cromo',date:today(),notes:'',lines:[],flete:false}; }
function seed(){
  const P=(code,name,cat,unit,pc,pd,fixed)=>({id:uid(),code,name,cat,unit,pc,pd,fixed:fixed||''});
  return {
    sample:true, nextNum:1,
    settings:{catDepot:Object.fromEntries(Object.entries(CATS).map(([k,v])=>[k,v.d])), flete:10000},
    products:[
      P('B001','Lavandina 1 L (bulto x12)','bulto','bulto',9800,8900),
      P('B002','Detergente 750 cc (bulto x12)','bulto','bulto',11400,10200),
      P('PH01','Papel higiénico 300 m (bolsa x8)','papel','bolsa',15200,14000),
      P('AC01','Trapo de piso','accesorio','un',1700,1500),
      P('AC02','Secador de piso 40 cm','accesorio','un',4300,3900),
      P('MP01','Base detergente','materia','kg',1200,1050),
      P('LC01','Desengrasante 1 L','liq_chico','un',2300,2050),
      P('CT01','Detergente concentrado – contenedor 1000 L','contenedor','un',410000,375000),
      P('TB01','Lavandina – tambor 200 L','tambor','un',98000,90000),
      P('BD20','Detergente – bidón 20 L','bidon20','un',24000,22000),
      P('BD05','Desinfectante – bidón 5 L','bidon5','un',7800,7000),
      P('KA05','Kaotrina – bidón 5 L','bidon5','un',9100,8200,'Rosario'),
      P('EN01','Envase vacío 5 L','envase','un',950,850)
    ],
    clients:[
      {id:uid(),num:'1001',name:'Cliente de ejemplo Uno'},
      {id:uid(),num:'1002',name:'Cliente de ejemplo Dos'},
      {id:uid(),num:'1003',name:'Cliente de ejemplo Tres'}
    ],
    orders:[], draft:newOrder(), editing:null
  };
}
function load(){ try{ const r=localStorage.getItem(KEY); if(r){ const s=JSON.parse(r); if(s&&s.products) return s; } }catch(e){} return seed(); }
function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
function save(){ persist(); try{ window.Sync&&Sync.changed(); }catch(e){} }
let S = load();
let V = {tab:'pedido', docKind:'total', docOrder:null, catForm:null, cliForm:null, catQ:'', cliQ:'', showImport:null};

/* ---------- Lógica ---------- */
const prodById = id => S.products.find(p=>p.id===id);
const cliById = id => S.clients.find(c=>c.id===id);
const defDepot = p => p.fixed || S.settings.catDepot[p.cat] || (CATS[p.cat]||{}).d || 'Rosario';
const effMod = (o,l) => l.mod || o.mod;
const linePrice = (o,l) => effMod(o,l)==='cromo' ? l.pc : l.pd;
const lineTotal = (o,l) => linePrice(o,l)*l.qty;
function totals(o){
  const t={cromo:0,demo:0};
  o.lines.forEach(l=>{ t[effMod(o,l)] += lineTotal(o,l); });
  const flete = o.flete ? S.settings.flete : 0;
  return {cromo:t.cromo, demo:t.demo, flete, total:t.cromo+t.demo+flete};
}
function addLine(p){
  const o=S.draft; const d=defDepot(p);
  const ex=o.lines.find(l=>l.pid===p.id);
  if(ex){ ex.qty+=1; }
  else o.lines.push({id:uid(),pid:p.id,code:p.code,name:p.name,cat:p.cat,unit:p.unit,pc:p.pc,pd:p.pd,qty:1,mod:null,depot:d,override:false});
  save();
}

/* ---------- Render ---------- */
const TABS=[['pedido','Pedido nuevo'],['pedidos','Pedidos guardados'],['catalogo','Catálogo'],['clientes','Clientes'],['control','Control'],['ajustes','Ajustes']];
function render(){
  $('#nav').innerHTML = TABS.map(([k,l])=>`<button data-a="tab" data-v="${k}" aria-current="${V.tab===k}">${l}${k==='pedidos'&&S.orders.length?` (${S.orders.length})`:''}${k==='control'&&issues().length?` (${issues().length})`:''}</button>`).join('');
  const m=$('#main');
  if(V.tab==='pedido') m.innerHTML=viewPedido();
  else if(V.tab==='pedidos') m.innerHTML=viewPedidos();
  else if(V.tab==='catalogo') m.innerHTML=viewCatalogo();
  else if(V.tab==='clientes') m.innerHTML=viewClientes();
  else if(V.tab==='control') m.innerHTML=viewControl();
  else if(V.tab==='ajustes') m.innerHTML=viewAjustes();
  else if(V.tab==='doc') m.innerHTML=viewDoc();
}

function viewPedido(){
  const o=S.draft, cli=cliById(o.clientId), t=totals(o);
  const editBanner = S.editing ? `<div class="notice">Estás editando el pedido N° ${esc((S.orders.find(x=>x.id===S.editing)||{}).num)}. Al guardar se reemplaza.</div>` : '';
  return `
  <h2>${S.editing?'Editar pedido':'Pedido nuevo'}</h2>${editBanner}
  <div class="card">
    <div class="grid g2">
      <div>
        <label for="clientQ">Cliente</label>
        ${cli?`<div class="chip"><span class="num"><b>${esc(cli.num)}</b></span> ${esc(cli.name)} <button class="btn sm sec" data-a="clearClient">Cambiar</button></div>`
             :`<input id="clientQ" placeholder="Buscar por número o nombre" autocomplete="off"><div id="clientRes" class="results"></div>`}
      </div>
      <div>
        <label>Modalidad principal</label>
        <div class="seg" role="group" aria-label="Modalidad principal">
          <button class="c" data-a="setMod" data-v="cromo" aria-pressed="${o.mod==='cromo'}">Cromo</button>
          <button class="d" data-a="setMod" data-v="demo" aria-pressed="${o.mod==='demo'}">Demo</button>
        </div>
      </div>
      <div><label for="oDate">Fecha</label><input id="oDate" type="date" value="${esc(o.date)}" data-c="date"></div>
      <div><label for="oNotes">Observaciones</label><input id="oNotes" value="${esc(o.notes)}" data-c="notes" placeholder="Opcional"></div>
    </div>
  </div>
  <div class="card">
    <label for="prodQ">Agregar producto</label>
    <input id="prodQ" placeholder="Buscar por código o nombre" autocomplete="off">
    <div id="prodRes" class="results"></div>
    <div style="margin-top:14px">${linesTable(o)}</div>
    <div class="totals">
      <label class="row" style="margin:0"><input type="checkbox" style="width:auto" data-c="flete" ${o.flete?'checked':''}> Incluir flete (${fmt(S.settings.flete)}, valor provisorio)</label>
      <span class="spacer"></span>
      <div class="box"><span class="muted">Cromo</span><div class="num"><b>${fmt(t.cromo)}</b></div></div>
      <div class="box"><span class="muted">Demo</span><div class="num"><b>${fmt(t.demo)}</b></div></div>
      <div class="box"><span class="muted">Total</span><div class="num big">${fmt(t.total)}</div></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="btn" data-a="saveOrder">${S.editing?'Guardar cambios':'Guardar pedido'}</button>
      <button class="btn sec" data-a="previewDocs">Ver documentos</button>
      <span class="spacer"></span>
      <button class="btn danger" data-a="clearOrder">Vaciar pedido</button>
    </div>
  </div>`;
}
function linesTable(o){
  if(!o.lines.length) return `<div class="empty">Todavía no hay productos. Buscá uno arriba para empezar.</div>`;
  return `<div class="tablewrap"><table>
  <thead><tr><th>Producto</th><th>Cant.</th><th>Lista</th><th>Depósito</th><th class="r">Precio</th><th class="r">Subtotal</th><th></th></tr></thead><tbody>
  ${o.lines.map(l=>{
    const em=effMod(o,l), exc=!!l.mod, price=linePrice(o,l);
    return `<tr class="${l.override?'ovr':''}">
      <td><b class="num">${esc(l.code)}</b> ${esc(l.name)}<div class="muted" style="font-size:12px">${esc((CATS[l.cat]||{}).l||l.cat)}${l.override?' <span class="tag w">depósito manual</span>':''}${exc?' <span class="tag w">excepción de lista</span>':''}</div></td>
      <td style="width:80px"><input type="number" min="1" step="1" value="${l.qty}" data-c="qty" data-id="${l.id}" aria-label="Cantidad"></td>
      <td style="width:100px"><select data-c="lmod" data-id="${l.id}" aria-label="Lista de precios"><option value="cromo" ${em==='cromo'?'selected':''}>Cromo</option><option value="demo" ${em==='demo'?'selected':''}>Demo</option></select></td>
      <td style="width:120px"><select data-c="ldepot" data-id="${l.id}" aria-label="Depósito">${DEPOTS.map(d=>`<option ${l.depot===d?'selected':''}>${d}</option>`).join('')}</select></td>
      <td class="r num">${price?fmt(price):'<span class="tag w">sin precio</span>'}</td>
      <td class="r num"><b>${fmt(price*l.qty)}</b></td>
      <td><button class="btn sm sec" data-a="rmLine" data-id="${l.id}" aria-label="Quitar">✕</button></td></tr>`;
  }).join('')}
  </tbody></table></div>`;
}

function viewPedidos(){
  if(!S.orders.length) return `<h2>Pedidos guardados</h2><div class="card empty">Todavía no guardaste ningún pedido.</div>`;
  const list=[...S.orders].sort((a,b)=>b.num-a.num);
  return `<h2>Pedidos guardados</h2><div class="card tablewrap"><table>
  <thead><tr><th>N°</th><th>Fecha</th><th>Cliente</th><th>Modalidad</th><th class="r">Total</th><th></th></tr></thead><tbody>
  ${list.map(o=>{const c=cliById(o.clientId)||o.clientSnap||{num:'',name:'(cliente eliminado)'}; return `<tr>
    <td class="num"><b>${o.num}</b></td><td class="num">${fdate(o.date)}</td><td>${esc(c.num)} ${esc(c.name)}</td>
    <td><span class="tag ${o.mod==='cromo'?'c':'d'}">${MODS[o.mod]}</span></td><td class="r num">${fmt(totals(o).total)}</td>
    <td><div class="row" style="justify-content:flex-end">
      <button class="btn sm" data-a="showDoc" data-id="${o.id}">Documentos</button>
      <button class="btn sm sec" data-a="editOrder" data-id="${o.id}">Editar</button>
      <button class="btn sm sec" data-a="dupOrder" data-id="${o.id}">Duplicar</button>
      <button class="btn sm danger" data-a="delOrder" data-id="${o.id}">Eliminar</button></div></td></tr>`;}).join('')}
  </tbody></table></div>`;
}

function viewCatalogo(){
  const f=V.catForm;
  const items=S.products.filter(p=>!V.catQ||match(V.catQ,p.code+' '+p.name+' '+(CATS[p.cat]||{}).l));
  const sampleNote=S.sample?`<div class="notice">Estos productos y clientes son de ejemplo. Borralos o importá los tuyos desde el botón “Importar”.</div>`:'';
  const form = f ? `<div class="card"><h3>${f.id?'Editar producto':'Producto nuevo'}</h3>
    <div class="grid g2">
      <div><label for="f_code">Código</label><input id="f_code" value="${esc(f.code)}"></div>
      <div><label for="f_name">Nombre</label><input id="f_name" value="${esc(f.name)}"></div>
      <div><label for="f_cat">Categoría</label><select id="f_cat">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${f.cat===k?'selected':''}>${v.l}</option>`).join('')}</select></div>
      <div><label for="f_unit">Unidad</label><input id="f_unit" value="${esc(f.unit)}" placeholder="un, kg, bulto…"></div>
      <div><label for="f_pc">Precio lista Cromo</label><input id="f_pc" inputmode="decimal" value="${f.pc||''}"></div>
      <div><label for="f_pd">Precio lista Demo</label><input id="f_pd" inputmode="decimal" value="${f.pd||''}"></div>
      <div><label for="f_fixed">Depósito fijo (excepción)</label><select id="f_fixed"><option value="">Según categoría</option>${DEPOTS.map(d=>`<option ${f.fixed===d?'selected':''}>${d}</option>`).join('')}</select></div>
    </div>

function syncPanel(){

  if(Y.state==='online') return `<p style="margin-top:0">Sincronizando como <b>${esc(Y.user)}</b>. Los cambios se comparten en tiempo real y se guardan aunque no haya señal.</p>${err}<button class="btn sec" data-a="syncLogout">Cerrar sesión</button>`;

}

/* ---------- Control: avisos de errores y cosas raras ---------- */
function issues(){
  const out=[]; const add=(lvl,msg,go)=>out.push({lvl,msg,go});
  const codes={};
  S.products.forEach(p=>{
    codes[norm(p.code)]=(codes[norm(p.code)]||[]).concat(p);
    if(!p.pc) add('e',`${p.code} · ${p.name}: precio Cromo en cero`,{a:'editProd',id:p.id});
    if(!p.pd) add('e',`${p.code} · ${p.name}: precio Demo en cero`,{a:'editProd',id:p.id});
    if(p.pc&&p.pd&&p.pd>p.pc) add('w',`${p.code} · ${p.name}: el precio Demo (${fmt(p.pd)}) es mayor que el Cromo (${fmt(p.pc)})`,{a:'editProd',id:p.id});
    if(!CATS[p.cat]) add('e',`${p.code} · ${p.name}: categoría no válida`,{a:'editProd',id:p.id});
  });
  Object.values(codes).filter(a=>a.length>1).forEach(a=>add('e',`Código repetido ${a[0].code}: ${a.map(x=>x.name).join(' / ')}`,{a:'editProd',id:a[0].id}));
  const nums={}; S.clients.forEach(c=>nums[c.num]=(nums[c.num]||[]).concat(c));
  Object.values(nums).filter(a=>a.length>1).forEach(a=>add('e',`Número de cliente repetido ${a[0].num}: ${a.map(x=>x.name).join(' / ')}`,{a:'editCli',id:a[0].id}));
  S.draft.lines.forEach(l=>{ if(!linePrice(S.draft,l)) add('e',`Pedido en curso: ${l.code} · ${l.name} no tiene precio en la lista ${MODS[effMod(S.draft,l)]}`,{a:'tab',v:'pedido'}); });
  S.orders.forEach(o=>o.lines.forEach(l=>{ if(!linePrice(o,l)) add('w',`Pedido N° ${o.num}: ${l.code} · ${l.name} quedó sin precio`,{a:'showDoc',id:o.id}); }));
  const n=S.orders.map(o=>o.num).sort((a,b)=>a-b); for(let i=1;i<n.length;i++) if(n[i]===n[i-1]) add('w',`Hay dos pedidos con el N° ${n[i]} (puede pasar si se cargaron sin conexión en dos equipos)`,{a:'tab',v:'pedidos'});
  return out;
}

function viewDoc(){

  if(!o) return `<div class="card empty">No se encontró el pedido.</div>`;

  return `<div class="noprint row" style="margin-bottom:14px">

    <span class="spacer"></span><button class="btn" data-a="print">Imprimir / guardar PDF</button></div>

function sheetHead(o,title){
  const c=cliById(o.clientId)||o.clientSnap||{num:'',name:'—'};
  return `<div class="meta"><div><h1>${title}</h1><div>Cliente: <b>${esc(c.num)} ${esc(c.name)}</b></div></div>
    <div style="text-align:right"><div>Pedido N° <b>${o.num||'borrador'}</b></div><div>${fdate(o.date)}</div></div></div>
    ${o.notes?`<p><b>Observaciones:</b> ${esc(o.notes)}</p>`:''}`;
}
function sheet(o,kind){
  if(!o.lines.length) return `<div class="sheet">${sheetHead(o,'Pedido')}<p>El pedido no tiene productos.</p></div>`;
  if(kind==='ros'||kind==='gal'){
    const depot = kind==='ros'?'Rosario':'Gálvez';
    const mine=o.lines.filter(l=>l.depot===depot);
    const groups=catOrder(depot).map(k=>({k,items:mine.filter(l=>l.cat===k)})).filter(g=>g.items.length);
    return `<div class="sheet">${sheetHead(o,'Preparación '+depot)}
      ${groups.length?groups.map(g=>`<h4>${esc(CATS[g.k].l)}</h4><table><thead><tr><th>Código</th><th>Producto</th><th class="r">Cantidad</th><th>Unidad</th></tr></thead><tbody>
      ${g.items.map(l=>`<tr><td>${esc(l.code)}</td><td>${esc(l.name)}${l.override?'<span class="mk">cambio manual</span>':''}</td><td class="r"><b>${l.qty}</b></td><td>${esc(l.unit)}</td></tr>`).join('')}</tbody></table>`).join(''):`<p>No hay productos para este depósito.</p>`}</div>`;
  }
  if(kind==='fact'){
    const t=totals(o);
    const block=(m)=>{ const ls=o.lines.filter(l=>effMod(o,l)===m); if(!ls.length) return '';
      return `<h4>${MODS[m]}</h4><table><thead><tr><th>Código</th><th>Producto</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Subtotal</th></tr></thead><tbody>
      ${ls.map(l=>`<tr><td>${esc(l.code)}</td><td>${esc(l.name)}</td><td class="r">${l.qty}</td><td class="r">${fmt(linePrice(o,l))}</td><td class="r">${fmt(lineTotal(o,l))}</td></tr>`).join('')}
      <tr class="sum"><td colspan="4" class="r">Subtotal ${MODS[m]}</td><td class="r">${fmt(t[m])}</td></tr></tbody></table>`; };
    return `<div class="sheet">${sheetHead(o,'Facturación')}${block('cromo')}${block('demo')}
      ${o.flete?`<table style="margin-top:12px"><tbody><tr><td>Flete</td><td class="r">${fmt(t.flete)}</td></tr></tbody></table>`:''}
      <table style="margin-top:8px"><tbody><tr class="sum"><td class="r">Total general</td><td class="r" style="width:150px">${fmt(t.total)}</td></tr></tbody></table></div>`;
  }
  const t=totals(o);
  const byDepot=DEPOTS.map(d=>({d,ls:o.lines.filter(l=>l.depot===d)})).filter(x=>x.ls.length);
  return `<div class="sheet">${sheetHead(o,'Pedido total')}
    ${byDepot.map(x=>`<h4>Sale de ${x.d}</h4><table><thead><tr><th>Código</th><th>Producto</th><th class="r">Cant.</th><th>Lista</th><th class="r">Precio</th><th class="r">Subtotal</th></tr></thead><tbody>
    ${x.ls.map(l=>`<tr><td>${esc(l.code)}</td><td>${esc(l.name)}${l.override?'<span class="mk">depósito manual</span>':''}</td><td class="r">${l.qty}</td><td>${MODS[effMod(o,l)]}</td><td class="r">${fmt(linePrice(o,l))}</td><td class="r">${fmt(lineTotal(o,l))}</td></tr>`).join('')}</tbody></table>`).join('')}
    <table style="margin-top:14px"><tbody>
      <tr><td class="r">Cromo</td><td class="r" style="width:150px">${fmt(t.cromo)}</td></tr>
      <tr><td class="r">Demo</td><td class="r">${fmt(t.demo)}</td></tr>
      ${o.flete?`<tr><td class="r">Flete</td><td class="r">${fmt(t.flete)}</td></tr>`:''}
      <tr class="sum"><td class="r">Total</td><td class="r">${fmt(t.total)}</td></tr></tbody></table></div>`;
}

/* ---------- Acciones ---------- */
function snapClient(o){ const c=cliById(o.clientId); if(c) o.clientSnap={num:c.num,name:c.name}; }
const ACT = {
  tab(d){ V.tab=d.v; V.catForm=V.cliForm=V.showImport=null; render(); },
  setMod(d){ S.draft.mod=d.v; S.draft.lines.forEach(l=>{ if(l.mod===d.v) l.mod=null; }); save(); render(); },
  pickClient(d){ S.draft.clientId=d.id; save(); render(); },
  clearClient(){ S.draft.clientId=null; save(); render(); setTimeout(()=>{const i=$('#clientQ'); i&&i.focus();},0); },
  addProd(d){ const p=prodById(d.id); if(!p) return; addLine(p); render(); const i=$('#prodQ'); i&&i.focus(); },
  rmLine(d){ S.draft.lines=S.draft.lines.filter(l=>l.id!==d.id); save(); render(); },
  clearOrder(){ if(S.draft.lines.length && !confirm('¿Vaciar el pedido actual?')) return; S.draft=newOrder(); S.editing=null; save(); render(); },
  async saveOrder(){
    const o=S.draft;
    if(!o.clientId) return toast('Elegí un cliente antes de guardar.');
    if(!o.lines.length) return toast('Agregá al menos un producto.');
    snapClient(o);
    if(S.editing){ const i=S.orders.findIndex(x=>x.id===S.editing); const num=S.orders[i].num; S.orders[i]=JSON.parse(JSON.stringify({...o,num})); }
    else {
      const maxN=S.orders.reduce((m,x)=>Math.max(m,x.num||0),0);
      let n=null; try{ n=window.Sync?await Sync.nextNum(maxN):null; }catch(e){}
      o.num = n || Math.max(S.nextNum, maxN+1); S.nextNum=o.num+1;
      S.orders.push(JSON.parse(JSON.stringify(o)));
    }
    const saved=S.orders.find(x=>x.id===o.id)||S.orders[S.orders.length-1];
    S.draft=newOrder(); S.editing=null; save(); toast('Pedido guardado.');
    V.tab='doc'; V.docKind='total'; V.docOrder=saved.id; V.back='pedidos'; render();
  },
  previewDocs(){ if(!S.draft.lines.length) return toast('Agregá productos para ver los documentos.'); snapClient(S.draft); V.tab='doc'; V.docKind='total'; V.docOrder='draft'; V.back='pedido'; render(); },
  showDoc(d){ V.tab='doc'; V.docKind='total'; V.docOrder=d.id; V.back='pedidos'; render(); },
  docKind(d){ V.docKind=d.v; render(); },
  backFromDoc(){ V.tab=V.back||'pedido'; render(); },
  print(){ window.print(); },
  editOrder(d){ const o=S.orders.find(x=>x.id===d.id); if(!o) return; S.draft=JSON.parse(JSON.stringify(o)); S.editing=o.id; save(); V.tab='pedido'; render(); },
  dupOrder(d){ const o=S.orders.find(x=>x.id===d.id); if(!o) return; const c=JSON.parse(JSON.stringify(o)); c.id=uid(); c.num=null; c.date=today(); c.lines.forEach(l=>l.id=uid()); S.draft=c; S.editing=null; save(); V.tab='pedido'; render(); toast('Copia lista para editar y guardar.'); },
  delOrder(d){ if(!confirm('¿Eliminar este pedido?')) return; S.orders=S.orders.filter(x=>x.id!==d.id); save(); render(); },
  /* catálogo */
  newProd(){ V.showImport=null; V.catForm={id:null,code:'',name:'',cat:'bulto',unit:'un',pc:0,pd:0,fixed:''}; render(); },
  editProd(d){ V.showImport=null; V.catForm={...prodById(d.id)}; render(); window.scrollTo(0,0); },
  saveProd(){
    const f=V.catForm; const g=id=>$('#'+id).value.trim();
    const p={id:f.id||uid(),code:g('f_code'),name:g('f_name'),cat:g('f_cat'),unit:g('f_unit')||'un',pc:num(g('f_pc')),pd:num(g('f_pd')),fixed:g('f_fixed')};
    if(!p.code||!p.name) return toast('Completá código y nombre.');
    const i=S.products.findIndex(x=>x.id===p.id); if(i>=0) S.products[i]=p; else S.products.push(p);
    V.catForm=null; save(); render(); toast('Producto guardado.');
  },
  delProd(d){ if(!confirm('¿Eliminar este producto? Los pedidos guardados no cambian.')) return; S.products=S.products.filter(p=>p.id!==d.id); save(); render(); },
  /* clientes */
  newCli(){ V.showImport=null; V.cliForm={id:null,num:'',name:''}; render(); },
  editCli(d){ V.showImport=null; V.cliForm={...cliById(d.id)}; render(); window.scrollTo(0,0); },
  saveCli(){
    const c={id:V.cliForm.id||uid(),num:$('#c_num').value.trim(),name:$('#c_name').value.trim()};
    if(!c.num||!c.name) return toast('Completá número y nombre.');
    const i=S.clients.findIndex(x=>x.id===c.id); if(i>=0) S.clients[i]=c; else S.clients.push(c);
    V.cliForm=null; save(); render(); toast('Cliente guardado.');
  },
  delCli(d){ if(!confirm('¿Eliminar este cliente? Los pedidos guardados conservan su nombre.')) return; S.clients=S.clients.filter(c=>c.id!==d.id); save(); render(); },
  goIssue(d){ const g=JSON.parse(d.go); if(g.a==='editProd'){ V.tab='catalogo'; render(); ACT.editProd({id:g.id}); } else if(g.a==='editCli'){ V.tab='clientes'; render(); ACT.editCli({id:g.id}); } else ACT[g.a](g); },
  install(){ if(!deferredInstall) return toast('Tu navegador no ofrece instalar desde acá. Usá el menú del navegador.'); deferredInstall.prompt(); deferredInstall.userChoice.finally(()=>{ deferredInstall=null; showInstall(); }); },
  applyUpdate(){ if(waitingSW) waitingSW.postMessage('SKIP_WAITING'); },
  checkUpdate(){ if(!swReg) return toast('La actualización automática no está disponible en este navegador.'); swReg.update().then(()=>toast(waitingSW?'Hay una versión nueva.':'Ya tenés la última versión.')).catch(()=>toast('No se pudo buscar. ¿Hay conexión?')); },
  syncLogin(){ const e=$('#syEmail').value.trim(), p=$('#syPass').value; if(!e||!p) return toast('Completá correo y contraseña.'); Sync.login(e,p); },
  syncLogout(){ Sync.logout(); },
  cancelForm(){ V.catForm=V.cliForm=V.showImport=null; render(); },
  showImport(d){ V.showImport=d.v; V.catForm=V.cliForm=null; render(); },
  runImportProd(){
    const rows=$('#impText').value.split(/\r?\n/).map(r=>r.split(/\t|;/).map(x=>x.trim())).filter(r=>r.length>=2&&r[0]);
    let n=0, bad=0;
    rows.forEach(r=>{
      const key=Object.keys(CATS).find(k=>norm(k)===norm(r[2])||norm(CATS[k].l)===norm(r[2]));
      if(!key){ bad++; return; }
      const p={id:uid(),code:r[0],name:r[1],cat:key,unit:r[5]||'un',pc:num(r[3]),pd:num(r[4]),fixed:''};
      const i=S.products.findIndex(x=>norm(x.code)===norm(p.code));
      if(i>=0){ p.id=S.products[i].id; p.fixed=S.products[i].fixed; S.products[i]=p; } else S.products.push(p);
      n++;
    });
    if(S.sample && n){ S.sample=false; }
    V.showImport=null; save(); render(); toast(`${n} productos importados${bad?`, ${bad} filas con categoría no reconocida`:''}.`);
  },
  runImportCli(){
    const rows=$('#impText').value.split(/\r?\n/).map(r=>r.split(/\t|;/).map(x=>x.trim())).filter(r=>r.length>=2&&r[0]);
    rows.forEach(r=>{ const i=S.clients.findIndex(c=>c.num===r[0]); if(i>=0) S.clients[i].name=r[1]; else S.clients.push({id:uid(),num:r[0],name:r[1]}); });
    V.showImport=null; save(); render(); toast(`${rows.length} clientes importados.`);
  },
  exportData(){
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));
    a.download='pedidos-copia-'+today()+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  },
  resetAll(){ if(!confirm('Se borran productos, clientes y pedidos. ¿Seguro?')) return; S=seed(); save(); V.tab='pedido'; render(); }
};
const CHG = {
  date(el){ S.draft.date=el.value; save(); },
  notes(el){ S.draft.notes=el.value; save(); },
  flete(el){ S.draft.flete=el.checked; save(); render(); },
  qty(el){ const l=S.draft.lines.find(x=>x.id===el.dataset.id); l.qty=Math.max(1,parseInt(el.value)||1); save(); render(); },
  lmod(el){ const l=S.draft.lines.find(x=>x.id===el.dataset.id); l.mod = el.value===S.draft.mod ? null : el.value; save(); render(); },
  ldepot(el){ const l=S.draft.lines.find(x=>x.id===el.dataset.id); const p=prodById(l.pid); const def=p?defDepot(p):(CATS[l.cat]||{}).d; l.depot=el.value; l.override=el.value!==def; save(); render(); },
  catDepot(el){ S.settings.catDepot[el.dataset.k]=el.value; save(); toast('Depósito actualizado para los próximos pedidos.'); },
  fleteV(el){ S.settings.flete=num(el.value); save(); toast('Flete actualizado.'); }
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-a]'); if(b&&ACT[b.dataset.a]) ACT[b.dataset.a](b.dataset); });
document.addEventListener('change',e=>{
  if(e.target.id==='restoreFile'){
    const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s.products||!s.clients) throw 0; S=s; save(); render(); toast('Copia restaurada.'); }catch(x){ toast('El archivo no es una copia válida.'); } };
    r.readAsText(f); return;
  }
  const c=e.target.dataset.c; if(c&&CHG[c]) CHG[c](e.target);
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='clientQ'){
    const q=e.target.value.trim(); const res=$('#clientRes');
    const hits=q?S.clients.filter(c=>match(q,c.num+' '+c.name)).slice(0,8):[];
    res.innerHTML = hits.map(c=>`<button data-a="pickClient" data-id="${c.id}"><b class="num">${esc(c.num)}</b> ${esc(c.name)}</button>`).join('') || (q?`<div class="empty" style="padding:10px">Sin resultados. Podés cargarlo en Clientes.</div>`:'');
  } else if(id==='prodQ'){
    const q=e.target.value.trim(); const res=$('#prodRes');
    const hits=q?S.products.filter(p=>match(q,p.code+' '+p.name+' '+(CATS[p.cat]||{}).l)).slice(0,10):[];
    res.innerHTML = hits.map(p=>`<button data-a="addProd" data-id="${p.id}"><b class="num">${esc(p.code)}</b><span>${esc(p.name)}</span><span class="spacer"></span><span class="muted" style="font-size:12px">${esc(defDepot(p))}</span></button>`).join('') || (q?`<div class="empty" style="padding:10px">Sin resultados. Podés cargarlo en Catálogo.</div>`:'');
  } else if(id==='catQ'){ V.catQ=e.target.value; const pos=e.target.selectionStart; render(); const i=$('#catQ'); i.focus(); i.setSelectionRange(pos,pos); }
  else if(id==='cliQ'){ V.cliQ=e.target.value; const pos=e.target.selectionStart; render(); const i=$('#cliQ'); i.focus(); i.setSelectionRange(pos,pos); }
});

/* ---------- PWA: instalación, sin conexión, actualizaciones, sincronización ---------- */
const APP_VERSION='1.0.0';
let deferredInstall=null, swReg=null, waitingSW=null;
function showInstall(){ const b=$('#installBtn'); if(b) b.hidden=!deferredInstall; const b2=$('#installBtn2'); if(b2) b2.hidden=!deferredInstall; }
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredInstall=e; showInstall(); });
window.addEventListener('appinstalled',()=>{ deferredInstall=null; showInstall(); toast('App instalada.'); });
function netTag(){ $('#netTag').hidden=navigator.onLine; }
window.addEventListener('online',netTag); window.addEventListener('offline',netTag); netTag();
function safeRender(){ const a=document.activeElement; const typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName); if(typing||V.catForm||V.cliForm||V.showImport) return; render(); }
window.APP={get S(){return S}, set S(v){S=v}, persist, render, safeRender};
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    swReg=reg;
    const watch=w=>w.addEventListener('statechange',()=>{ if(w.state==='installed'&&navigator.serviceWorker.controller){ waitingSW=w; $('#updBar').hidden=false; } });
    if(reg.waiting&&navigator.serviceWorker.controller){ waitingSW=reg.waiting; $('#updBar').hidden=false; }
    reg.addEventListener('updatefound',()=>reg.installing&&watch(reg.installing));
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloaded) return; reloaded=true; location.reload(); });
}
render();
const cfgScript=document.createElement('script'); cfgScript.src='firebase-config.js';
cfgScript.onload=cfgScript.onerror=()=>{
  const m=document.createElement('script'); m.type='module'; m.src='sync.js';
  m.onload=()=>{ if(window.Sync){ Sync.onStatus(()=>{ if(V.tab==='ajustes') render(); }); if(V.tab==='ajustes') render(); } };
  document.head.appendChild(m);
};
document.head.appendChild(cfgScript);
</script>
